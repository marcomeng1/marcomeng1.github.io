baseURL = "https://marcomeng1.github.io/"
languageCode = "en-us"
title = "Xuming Meng"
theme = "personal-web"
copyright="© Xuming Meng"
googleAnalytics = ""
enableEmoji=true
enableRobotsTXT=true
pygmentsUseClasses=true
pygmentsCodeFences=true
disableKinds = ["taxonomy", "term"]

[params.intro]
  main = "Xuming Meng <br> 孟旭明"
  sub = "Dr.-Ing. in Robotics <br> Reactive, contact-rich manipulation"

[params.main]
  latestPublishHeader = " "

[blackfriday]
  hrefTargetBlank = true

[params]
  breadcrumb = true
  accentColor = "#FD3519"
  mainSections = ['portfolio'] # values: ['post', 'portfolio'] only accept one section, to be displayed bellow 404
  rendererSafe = false # set to true if wish to remove the unsafe renderer setting below (recommended). Titles will not be run through markdownify

[params.notFound]
  gopher = "/images/gopher.png" # checkout https://gopherize.me/
  h1 = 'Bummer!'
  p = "It seems that this page doesn't exist."

[params.sections]
  # Define how your sections will be called
  # when automatically pulled. For instance in the 404 page
  post = "article"
  portfolio = "project"

[params.sidebar]
  backgroundImage = "/images/sample.jpg" # header background image - default "/images/default_sidebar.jpg" - Photo by Tim Marshall on Unsplash
  gradientOverlay = '' # default: rgba(0,0,0,0.4),rgba(0,0,0,0.4)
  logo = "images/xuming.jpg" # - default "/images/edna-west.jpg"
[params.assets]
  favicon = "/favicon-32.png"
  customCSS = ""

[params.social]
  linkedin = "https://www.linkedin.com/in/xuming-meng"
  googlescholar = "https://scholar.google.com/citations?user=NfbJhgEAAAAJ&hl=en"
  orcid = "https://orcid.org/0000-0001-5642-1830"

[params.contact]
  email = "xuming.meng@yahoo.com"
  text= "Email" # text of the contact link in the sidebar. If email params.contact.email is defined


[menu]

[[menu.main]]
  identifier = "news"
  name = "News"
  title = "News"
  url = "/news/"
  weight = -120

[[menu.main]]
  identifier = "cv"
  name = "CV"
  title = "CV"
  url = "/cv/"
  weight = -110

[[menu.main]]
  identifier = "publications"
  name = "Projects"
  title = "Projects"
  url = "/publications/"
  weight = -100

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
    disable = true
    respectDoNotTrack = true
    useSessionStorage = false
  [privacy.youtube]
    privacyEnhanced = true
  [privacy.twitter]
    disable = false
    enableDNT = true
    simple = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
