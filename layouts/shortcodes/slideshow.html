{{- $deck := index site.Data (.Get "data") -}}
{{- $slides := $deck.slides -}}
{{- $count := len $slides -}}
<div class="slideshow" data-count="{{ $count }}" tabindex="0" aria-roledescription="slideshow" aria-label="{{ .Get "title" }}">
  <div class="slideshow-stage">
    {{- range $i, $s := $slides }}
    {{- $n := add $i 1 }}
    <figure class="slideshow-slide{{ if eq $i 0 }} is-active{{ end }}" data-index="{{ $n }}" aria-label="Slide {{ $n }} of {{ $count }}"{{ if ne $i 0 }} hidden{{ end }}>
      <img {{ if lt $i 2 }}src{{ else }}data-src{{ end }}="{{ $deck.path }}slide-{{ printf "%02d" $n }}.jpg" alt="Slide {{ $n }}: {{ $s.title }}" width="1600" height="900">
      {{- if $s.youtube }}
      <figcaption><a href="https://www.youtube.com/watch?v={{ $s.youtube }}" target="_blank" rel="noopener">Watch this experiment in the Finger Flow video</a></figcaption>
      {{- else if $s.note }}
      <figcaption>{{ $s.note }}</figcaption>
      {{- else if $s.video }}
      <figcaption>This slide contains a video in the original talk.</figcaption>
      {{- end }}
    </figure>
    {{- end }}
  </div>
  <div class="slideshow-controls">
    <button type="button" class="slideshow-prev" aria-label="Previous slide">&larr;</button>
    <span class="slideshow-counter" aria-live="polite">1 / {{ $count }}</span>
    <button type="button" class="slideshow-next" aria-label="Next slide">&rarr;</button>
    <button type="button" class="slideshow-full" aria-label="Full screen">Full screen</button>
  </div>
  <noscript>
    <ol>
      {{- range $i, $s := $slides }}
      <li><a href="{{ $deck.path }}slide-{{ printf "%02d" (add $i 1) }}.jpg">{{ $s.title }}</a></li>
      {{- end }}
    </ol>
  </noscript>
</div>
<script src="/js/slideshow.js" defer></script>
